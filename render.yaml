services:
  - type: web
    name: fantasy-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./backend/fantasy.db
      - key: FOOTBALL_API_TOKEN
        value: bbb143c3e3834132934ccf14fa9343ea
      - key: TG_BOT_TOKEN
        value: 7810185081:AAHX-vIcHd8_2kwlEUoq6_BBpeQ5cTLWMGM
      - key: FRONTEND_ORIGIN
        value: https://fantasy-frontend-cut2.onrender.com
    autoDeploy: true

  - type: web
    name: fantasy-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://fantasy-backend-eruk.onrender.com
    autoDeploy: true
